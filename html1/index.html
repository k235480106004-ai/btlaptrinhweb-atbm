<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Đăng Ký Học Phần - Vũ Thế Anh</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0d9488; --text: #f8fafc; --muted: #94a3b8; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 30px; }
        .container { max-width: 900px; margin: auto; }
        .header { background: var(--card); padding: 25px; border-radius: 12px; border-left: 6px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h1 { margin: 0 0 8px 0; color: #2dd4bf; font-size: 24px; }
        .info { color: var(--muted); font-size: 14px; }
        .btn { background: #0d9488; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn:hover { background: #14b8a6; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #2dd4bf; text-transform: uppercase; font-size: 13px; }
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .tag-active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .tag-full { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>CỔNG ĐĂNG KÝ HỌC PHẦN & QUẢN LÝ TÍN CHỈ TẬP TRUNG</h1>
        <div class="info">Sinh viên thực hiện: <b>Vũ Thế Anh</b> | MSSV: <b>K235480106004</b></div>
    </div>

    <button class="btn" onclick="loadCourses()">Nạp Danh Sách Học Phần (API Node-RED)</button>

    <table id="courseTable">
        <thead>
            <tr>
                <th>Mã HP</th>
                <th>Tên Học Phần</th>
                <th>Số Tín Chỉ</th>
                <th>Trạng Thái Lớp</th>
                <th>Học Phí Tín Chỉ</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="5" style="text-align: center; color: var(--muted);">Bấm nút trên để truy xuất dữ liệu từ Server</td></tr>
        </tbody>
    </table>
</div>

<script>
    function loadCourses() {
        fetch('/api/benh-nhan')
            .then(res => res.json())
            .then(data => render(data))
            .catch(() => {
                const demo = [
                    { code: "INT301", name: "Lập trình Web nâng cao & Cloud", tc: 3, status: "Mở đăng ký", fee: "1.200.000 VNĐ" },
                    { code: "SEC402", name: "An toàn & Bảo mật Thông tin", tc: 3, status: "Mở đăng ký", fee: "1.200.000 VNĐ" },
                    { code: "DAT205", name: "Cơ sở dữ liệu Phân tán", tc: 4, status: "Đã hết chỗ", fee: "1.600.000 VNĐ" }
                ];
                render(demo);
            });
    }

    function render(list) {
        let html = '';
        list.forEach(c => {
            let tag = c.status === 'Mở đăng ký' ? `<span class="tag tag-active">Mở đăng ký</span>` : `<span class="tag tag-full">Đã hết chỗ</span>`;
            html += `<tr>
                <td><b>${c.code}</b></td>
                <td>${c.name}</td>
                <td>${c.tc} Tín chỉ</td>
                <td>${tag}</td>
                <td><b style="color: #2dd4bf;">${c.fee}</b></td>
            </tr>`;
        });
        document.getElementById('courseTable').querySelector('tbody').innerHTML = html;
    }
</script>
</body>
</html>
